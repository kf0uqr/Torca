<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TORCA -- CW Tool</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
    <a id="back-link" href="#">&larr; Radio</a>
    <h1>CW Tool</h1>
    <span id="conn-status" class="empty">connecting...</span>
</header>
<div id="token-banner" class="token-banner" style="display:none;">
    <span>Remote Access needs a token to continue -- find it in TORCA's Remote Access dialog.</span>
    <input id="token-input" type="text" placeholder="Access token" autocomplete="off">
    <button id="token-submit">Connect</button>
</div>
<div id="role-banner" class="token-banner" style="display:none;">
    <span id="role-banner-text"></span>
</div>
<main>
    <div class="panel" style="grid-column: 1 / -1;">
        <div class="controls-row">
            <button id="decode-toggle">Start Decoding</button>
            <label>WPM
                <span class="number-stepper">
                    <input id="wpm-input" type="number" min="5" max="60" value="20">
                    <span class="stepper-arrows">
                        <button type="button" class="stepper-btn stepper-up" data-target="wpm-input" aria-label="Increase WPM">&#9650;</button>
                        <button type="button" class="stepper-btn stepper-down" data-target="wpm-input" aria-label="Decrease WPM">&#9660;</button>
                    </span>
                </span>
            </label>
            <label>Pitch (Hz)
                <span class="number-stepper">
                    <input id="pitch-input" type="number" min="300" max="900" step="5" value="600">
                    <span class="stepper-arrows">
                        <button type="button" class="stepper-btn stepper-up" data-target="pitch-input" aria-label="Increase pitch">&#9650;</button>
                        <button type="button" class="stepper-btn stepper-down" data-target="pitch-input" aria-label="Decrease pitch">&#9660;</button>
                    </span>
                </span>
            </label>
        </div>
    </div>

    <div class="panel" style="grid-column: 1 / -1;">
        <h2>Decoded Text</h2>
        <pre id="decoded-text" class="decoded-text"></pre>
    </div>

    <div class="panel" style="grid-column: 1 / -1;">
        <h2>Send</h2>
        <div class="controls-row">
            <input id="send-input" type="text" placeholder="Text to send as CW..." style="flex:1;">
            <button id="send-button">Send</button>
        </div>
        <div id="macros" class="macro-row"></div>
    </div>
</main>
<script src="/static/cw.js"></script>
</body>
</html>
